<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>document.documentElement.classList.add('js');</script>

<title>Página não encontrada — Studio Web</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0a0a0a">

<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
  /* Layout exclusivo da 404 — não vale a pena carregar isso no style.css. */
  .nf {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 100px 24px 60px;
    position: relative;
    overflow: hidden;
  }
  .nf-code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.14em;
    color: var(--orange);
    margin-bottom: 28px;
    position: relative;
    z-index: 2;
  }
  .nf-title {
    font-size: clamp(2.4rem, 7vw, 4.5rem);
    font-weight: 500;
    line-height: 1.0;
    letter-spacing: -0.04em;
    max-width: 14ch;
    position: relative;
    z-index: 2;
  }
  .nf-title em {
    font-family: 'Instrument Serif', serif;
    font-style: italic;
    font-weight: 400;
    color: var(--orange);
  }
  .nf-sub {
    font-size: 1.05rem;
    color: var(--gray-300);
    max-width: 46ch;
    line-height: 1.55;
    margin-top: 24px;
    position: relative;
    z-index: 2;
  }
  .nf-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    margin-top: 40px;
    position: relative;
    z-index: 2;
  }
  @media (max-width: 600px) {
    .nf-actions { width: 100%; flex-direction: column; }
    .nf-actions a { justify-content: center; }
  }
</style>
</head>
<body>

<div class="cursor"></div>
<div class="cursor-dot"></div>

<main class="nf">
  <div class="hero-glow"></div>
  <div class="hero-glow-2"></div>

  <p class="nf-code">Erro 404</p>

  <h1 class="nf-title">Essa página <em>não existe</em>.</h1>

  <p class="nf-sub">
    Ou o endereço veio digitado errado, ou a página saiu do ar. As duas coisas
    têm a mesma solução: volta pro começo, ou chama no WhatsApp que a gente resolve.
  </p>

  <div class="nf-actions">
    <a href="/" class="btn-primary">
      Voltar para a home
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 17L17 7M7 7h10v10"/></svg>
    </a>
    <a href="https://wa.me/5521991088053?text=Olá!%20Caí%20numa%20página%20que%20não%20existe%20no%20site%20do%20Studio%20Web" target="_blank" rel="noopener" class="btn-secondary">
      Falar no WhatsApp
    </a>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
